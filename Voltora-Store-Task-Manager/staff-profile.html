<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff Profile | Voltora</title>
    <meta
      name="description"
      content="Staff member profile with task statistics, current tasks, weekly schedule and recent activity."
    />
    <meta name="author" content="Voltora Store Staff Task Manager" />
    <meta name="theme-color" content="#0d1526" />
    <meta
      property="og:title"
      content="Staff Profile | Voltora Store Staff Task Manager"
    />
    <meta
      property="og:description"
      content="Staff member profile with task statistics, current tasks, weekly schedule and recent activity."
    />
    <meta property="og:type" content="website" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/logo/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
    <script src="js/theme.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
    <link href="css/services.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/macos.css" rel="stylesheet" />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/motion.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav"></div>
    <main>
      <nav class="crumbs" aria-label="Breadcrumb" data-anim="header">
        <ol class="breadcrumb" id="crumbList"></ol>
      </nav>
      <div id="notFound" class="card-v d-none"></div>
      <div id="profile" class="d-none">
        <section class="card-v mb-3" data-anim="header" aria-labelledby="pName">
          <div class="d-flex flex-wrap align-items-center gap-3">
            <div id="pAvatar"></div>
            <div class="flex-grow-1">
              <h1 class="h3 fw-bold mb-1" id="pName"></h1>
              <div class="d-flex flex-wrap gap-2 align-items-center">
                <span id="pPos" class="fw-semibold"></span
                ><span id="pStatus"></span>
              </div>
              <div class="small mu mt-2 d-flex flex-wrap gap-3">
                <span id="pId"></span><span id="pEmail"></span
                ><span id="pPhone"></span>
              </div>
            </div>
            <div class="d-flex gap-2" id="pActions"></div>
          </div>
        </section>

        <section aria-labelledby="statHead">
          <h2 class="visually-hidden" id="statHead">Performance summary</h2>
          <div class="row g-3 mb-3" id="stats"></div>
        </section>

        <div class="row g-3">
          <div class="col-lg-7">
            <section
              class="card-v mb-3"
              data-anim="panel"
              aria-labelledby="curHead"
            >
              <div class="card-head">
                <h2 class="card-title" id="curHead">Current tasks</h2>
                <a href="tasks.html" class="btn btn-o btn-sm" id="allTasks"
                  >All tasks</a
                >
              </div>
              <div id="current"></div>
            </section>
            <section class="card-v" data-anim="panel" aria-labelledby="schHead">
              <div class="card-head">
                <div>
                  <h2 class="card-title" id="schHead">Schedule this week</h2>
                  <p class="card-sub">
                    Working shifts (store hours 10am - 9pm)
                  </p>
                </div>
              </div>
              <div class="row g-2 row-cols-4 row-cols-md-7" id="week"></div>
            </section>
          </div>
          <div class="col-lg-5">
            <section
              class="card-v mb-3"
              data-anim="chart"
              aria-labelledby="chHead"
            >
              <div class="card-head">
                <div>
                  <h2 class="card-title" id="chHead">Tasks by status</h2>
                  <p class="card-sub">All tasks assigned to this person</p>
                </div>
              </div>
              <div class="chart-box sm"><canvas id="cStatus"></canvas></div>
            </section>
            <section class="card-v" data-anim="panel" aria-labelledby="actHead">
              <div class="card-head">
                <h2 class="card-title" id="actHead">Recent activity</h2>
              </div>
              <ul class="timeline" id="activity"></ul>
            </section>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script src="js/fx.js" defer></script>
    <script src="js/vendor/anime.min.js" defer></script>
    <script src="js/vendor/particles.js" defer></script>
    <script src="js/motionfx.js" defer></script>
    <script src="js/btnfx.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/services-data.js" defer></script>
    <script src="js/repairs.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/charts.js" defer></script>
    <script src="js/staff-profile.js" defer></script>
  </body>
</html>
