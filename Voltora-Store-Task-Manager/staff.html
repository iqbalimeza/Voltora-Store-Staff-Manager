<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff Management | Voltora</title>
    <meta
      name="description"
      content="Manage Voltora store staff: search, filter, add, edit and review workload."
    />
    <meta name="author" content="Voltora Store Staff Task Manager" />
    <meta name="theme-color" content="#0d1526" />
    <meta
      property="og:title"
      content="Staff Management | Voltora Store Staff Task Manager"
    />
    <meta
      property="og:description"
      content="Manage Voltora store staff: search, filter, add, edit and review workload."
    />
    <meta property="og:type" content="website" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/logo/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
    <script src="js/theme.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
    <link href="css/services.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/macos.css" rel="stylesheet" />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/motion.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav"></div>
    <main>
      <nav class="crumbs" aria-label="Breadcrumb" data-anim="header">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Staff</li>
        </ol>
      </nav>
      <header class="page-head" data-anim="header">
        <div>
          <h1>Staff Management</h1>
          <p>Team members, workload and availability.</p>
        </div>
        <button class="btn btn-v" id="addBtn">
          <i class="bi bi-person-plus"></i> Add staff
        </button>
      </header>

      <section
        class="card-v filter-bar"
        data-anim="filter"
        aria-label="Search and filter staff"
      >
        <div class="fg grow">
          <label for="q">Search</label
          ><input
            id="q"
            type="search"
            class="form-control"
            placeholder="Name, ID, email or position"
          />
        </div>
        <div class="fg">
          <label for="fStatus">Status</label
          ><select id="fStatus" class="form-select">
            <option value="">All</option>
          </select>
        </div>
        <div class="fg">
          <label for="fPos">Position</label
          ><select id="fPos" class="form-select">
            <option value="">All positions</option>
          </select>
        </div>
        <div class="fg flex-grow-0" style="flex: 0 0 auto">
          <button class="btn btn-o" id="fReset" aria-label="Reset filters">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </section>

      <section class="card-v" data-anim="table" aria-label="Staff list">
        <div class="table-wrap">
          <table class="table table-v">
            <thead>
              <tr>
                <th>Staff ID</th>
                <th>Name</th>
                <th class="hide-md">Position</th>
                <th class="text-center">Assigned tasks</th>
                <th class="text-center">Completed</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pager"></div>
      </section>

      <div
        class="modal fade"
        id="staffModal"
        tabindex="-1"
        aria-labelledby="staffModalTitle"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <form class="modal-content" id="staffForm" novalidate>
            <div class="modal-header">
              <h2 class="modal-title" id="staffModalTitle">Add staff</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="sId" />
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label" for="sName">Full name *</label
                  ><input id="sName" class="form-control" maxlength="60" />
                  <div class="invalid-feedback">
                    Please enter the staff name.
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="sPos">Position</label
                  ><select id="sPos" class="form-select"></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="sStatus">Status</label
                  ><select id="sStatus" class="form-select"></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="sEmail">Email *</label
                  ><input id="sEmail" type="email" class="form-control" />
                  <div class="invalid-feedback" id="sEmailErr">
                    Enter a valid email address.
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="sPhone">Contact number</label
                  ><input
                    id="sPhone"
                    class="form-control"
                    placeholder="012-3456789"
                  />
                </div>
                <div class="col-12">
                  <p class="small mu mb-0" id="sHint">
                    A staff account is created with the demo password
                    <code>Voltora@123</code>.
                  </p>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-o" data-bs-dismiss="modal">
                Cancel</button
              ><button class="btn btn-v" type="submit">
                <i class="bi bi-check2"></i> Save staff
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script src="js/fx.js" defer></script>
    <script src="js/vendor/anime.min.js" defer></script>
    <script src="js/vendor/particles.js" defer></script>
    <script src="js/motionfx.js" defer></script>
    <script src="js/btnfx.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/services-data.js" defer></script>
    <script src="js/repairs.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/staff.js" defer></script>
  </body>
</html>
