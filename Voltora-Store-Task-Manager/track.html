<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track Your Repair | Voltora</title>
    <meta
      name="description"
      content="Check the progress of your Voltora repair with your repair request ID and registered contact number."
    />
    <meta name="author" content="Voltora" />
    <meta name="theme-color" content="#0d1526" />
    <meta property="og:title" content="Track Your Repair | Voltora" />
    <meta
      property="og:description"
      content="Check the progress of your Voltora repair with your repair request ID and registered contact number."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="assets/logo/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/logo/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
    <script src="js/theme.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
    <link href="css/services.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/macos.css" rel="stylesheet" />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/motion.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav"></div>
    <main>
      <section class="trk-hero">
        <div class="in">
          <p class="sv-eyebrow">Voltora &middot; Repair tracking</p>
          <h1>Track your<br /><span class="outline">repair</span></h1>
          <p>
            Enter your repair request ID and the contact number you used when
            you submitted the request.
          </p>
        </div>
      </section>
      <div class="trk-wrap">
        <section class="card-v mb-3" aria-labelledby="fHead">
          <h2 class="visually-hidden" id="fHead">Find my repair</h2>
          <form id="trkForm" novalidate>
            <div class="row g-3 align-items-start">
              <div class="col-md-5">
                <label class="form-label" for="tId">Repair request ID *</label
                ><input
                  id="tId"
                  class="form-control"
                  placeholder="VR-2026-0001"
                  maxlength="14"
                  autocomplete="off"
                />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="tPhone"
                  >Registered contact number *</label
                ><input
                  id="tPhone"
                  class="form-control"
                  inputmode="tel"
                  placeholder="012-345 6789"
                  maxlength="16"
                  autocomplete="off"
                />
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-3 d-grid" style="padding-top: 1.9rem">
                <button class="btn btn-v" type="submit">
                  <i class="bi bi-search"></i> Check status
                </button>
              </div>
            </div>
          </form>
          <p class="small mu mt-3 mb-0">
            <i class="bi bi-shield-lock me-1"></i> For your privacy, repair
            details are shown only when the ID and contact number match.
          </p>
        </section>
        <div id="result" aria-live="polite"></div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script src="js/fx.js" defer></script>
    <script src="js/vendor/anime.min.js" defer></script>
    <script src="js/vendor/particles.js" defer></script>
    <script src="js/motionfx.js" defer></script>
    <script src="js/btnfx.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/services-data.js" defer></script>
    <script src="js/repairs.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/track.js" defer></script>
  </body>
</html>
