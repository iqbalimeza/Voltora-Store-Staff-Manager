<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Details | Voltora</title>
    <meta
      name="description"
      content="View a single task, update its progress and status, and read its activity history."
    />
    <meta name="author" content="Voltora Store Staff Task Manager" />
    <meta name="theme-color" content="#0d1526" />
    <meta
      property="og:title"
      content="Task Details | Voltora Store Staff Task Manager"
    />
    <meta
      property="og:description"
      content="View a single task, update its progress and status, and read its activity history."
    />
    <meta property="og:type" content="website" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/logo/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
    <script src="js/theme.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
    <link href="css/services.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/macos.css" rel="stylesheet" />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/motion.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav"></div>
    <main>
      <nav class="crumbs" aria-label="Breadcrumb" data-anim="header">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
          <li class="breadcrumb-item"><a href="tasks.html">Tasks</a></li>
          <li class="breadcrumb-item active" aria-current="page">
            Task Details
          </li>
        </ol>
      </nav>
      <div id="notFound" class="card-v d-none" data-anim="panel"></div>
      <div id="detail" class="d-none">
        <header class="page-head" data-anim="header">
          <div>
            <h1 id="dTitle">Task</h1>
            <p class="d-flex flex-wrap gap-2 align-items-center mt-2 mb-0">
              <span id="dBadges"></span><span class="mu" id="dMeta"></span>
            </p>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-o" href="tasks.html"
              ><i class="bi bi-arrow-left"></i> Back</a
            ><a class="btn btn-o d-none" id="editBtn"
              ><i class="bi bi-pencil"></i> Edit</a
            ><button class="btn btn-o d-none" id="delBtn">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </header>

        <div class="row g-3">
          <div class="col-lg-7">
            <section
              class="card-v mb-3 d-none"
              id="repairPanel"
              data-anim="panel"
              aria-labelledby="repHead"
            >
              <div class="card-head">
                <h2 class="card-title" id="repHead">
                  <i class="bi bi-tools me-2"></i>Repair job
                </h2>
                <span id="repBadge"></span>
              </div>
              <dl class="kv" id="repInfo"></dl>
              <div class="d-flex flex-wrap gap-2 mt-2" id="repActions"></div>
            </section>
            <section
              class="card-v mb-3"
              data-anim="panel"
              aria-labelledby="infoHead"
            >
              <div class="card-head">
                <h2 class="card-title" id="infoHead">Task information</h2>
              </div>
              <dl class="kv" id="dInfo"></dl>
            </section>
            <section class="card-v" data-anim="panel" aria-labelledby="remHead">
              <div class="card-head">
                <h2 class="card-title" id="remHead">Remarks</h2>
              </div>
              <label class="visually-hidden" for="remarks">Remarks</label>
              <textarea
                id="remarks"
                class="form-control mb-2"
                rows="3"
                maxlength="300"
                placeholder="Add a note for the team"
              ></textarea>
              <button class="btn btn-o btn-sm" id="saveRem">
                <i class="bi bi-check2"></i> Save remarks
              </button>
            </section>
          </div>
          <div class="col-lg-5">
            <section
              class="card-v mb-3"
              data-anim="panel"
              aria-labelledby="progHead"
            >
              <div class="card-head">
                <h2 class="card-title" id="progHead">Progress &amp; status</h2>
              </div>
              <div class="d-flex align-items-center gap-3 mb-3">
                <div class="ring">
                  <svg
                    width="96"
                    height="96"
                    viewBox="0 0 96 96"
                    aria-hidden="true"
                  >
                    <circle
                      cx="48"
                      cy="48"
                      r="40"
                      fill="none"
                      stroke="#e9edf5"
                      stroke-width="10"
                    />
                    <circle
                      id="ringArc"
                      cx="48"
                      cy="48"
                      r="40"
                      fill="none"
                      stroke="#5b3fd4"
                      stroke-width="10"
                      stroke-linecap="round"
                      stroke-dasharray="251.33"
                      stroke-dashoffset="251.33"
                      data-ring="0"
                    />
                  </svg>
                  <div class="ring-val num" id="ringVal">0%</div>
                </div>
                <div class="flex-grow-1">
                  <div class="small mu mb-1" id="dueNote"></div>
                  <div class="pbar" id="dBar">
                    <span data-progress="0"></span>
                  </div>
                </div>
              </div>
              <label class="form-label" for="pRange"
                >Update progress: <output id="pOut">0%</output></label
              >
              <input
                type="range"
                id="pRange"
                class="form-range mb-2"
                min="0"
                max="100"
                step="5"
              />
              <label class="form-label" for="pStatus">Status</label>
              <select id="pStatus" class="form-select mb-3"></select>
              <button class="btn btn-v w-100" id="saveProg">
                <i class="bi bi-check2-circle"></i> Save update
              </button>
            </section>
            <section class="card-v" data-anim="panel" aria-labelledby="hisHead">
              <div class="card-head">
                <h2 class="card-title" id="hisHead">Task activity</h2>
              </div>
              <ul class="timeline" id="dHistory"></ul>
            </section>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script src="js/fx.js" defer></script>
    <script src="js/vendor/anime.min.js" defer></script>
    <script src="js/vendor/particles.js" defer></script>
    <script src="js/motionfx.js" defer></script>
    <script src="js/btnfx.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/services-data.js" defer></script>
    <script src="js/repairs.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/task-detail.js" defer></script>
  </body>
</html>
