<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repair Management | Voltora</title>
    <meta
      name="description"
      content="Review repair requests, assign technicians, track progress and manage collection and delivery."
    />
    <meta name="author" content="Voltora" />
    <meta name="theme-color" content="#0d1526" />
    <meta property="og:title" content="Repair Management | Voltora" />
    <meta
      property="og:description"
      content="Review repair requests, assign technicians, track progress and manage collection and delivery."
    />
    <meta property="og:type" content="website" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/logo/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
    <script src="js/theme.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
    <link href="css/services.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/macos.css" rel="stylesheet" />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/motion.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav"></div>
    <main>
      <nav class="crumbs" aria-label="Breadcrumb" data-anim="header">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">
            Repair Management
          </li>
        </ol>
      </nav>
      <header class="page-head" data-anim="header">
        <div>
          <h1>Repair Management</h1>
          <p>
            Review requests, assign technicians and follow every repair through
            collection or delivery.
          </p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
          <a class="btn btn-o" href="services.html"
            ><i class="bi bi-tools"></i> Service catalogue</a
          ><button class="btn btn-o" id="exportBtn">
            <i class="bi bi-download"></i> Export CSV
          </button>
        </div>
      </header>
      <div
        class="rp-chips"
        id="chips"
        data-anim="filter"
        role="group"
        aria-label="Quick filters"
      ></div>
      <section
        class="card-v filter-bar"
        data-anim="filter"
        aria-label="Search and filter repairs"
      >
        <div class="fg grow">
          <label for="q">Search</label
          ><input
            id="q"
            type="search"
            class="form-control"
            placeholder="Repair ID, customer, device or service"
          />
        </div>
        <div class="fg">
          <label for="fStatus">Repair status</label
          ><select id="fStatus" class="form-select"></select>
        </div>
        <div class="fg">
          <label for="fFul">Fulfilment</label
          ><select id="fFul" class="form-select"></select>
        </div>
        <div class="fg">
          <label for="fStaff">Technician</label
          ><select id="fStaff" class="form-select"></select>
        </div>
        <div class="fg">
          <label for="fPri">Priority</label
          ><select id="fPri" class="form-select">
            <option value="">All</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div class="fg flex-grow-0" style="flex: 0 0 auto">
          <button class="btn btn-o" id="fReset" aria-label="Reset filters">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </section>
      <section class="card-v" data-anim="table" aria-label="Repair list">
        <div class="table-wrap">
          <table class="table table-v">
            <thead>
              <tr>
                <th class="sortable" data-sort="id">
                  Repair ID <i class="bi bi-arrow-down-up small"></i>
                </th>
                <th class="sortable" data-sort="cust">
                  Customer <i class="bi bi-arrow-down-up small"></i>
                </th>
                <th class="hide-md">Device</th>
                <th class="hide-lg">Service</th>
                <th class="hide-xl">Assigned staff</th>
                <th class="hide-lg">Priority</th>
                <th class="sortable hide-md" data-sort="date">
                  Requested <i class="bi bi-arrow-down-up small"></i>
                </th>
                <th class="sortable hide-xl" data-sort="due">
                  Est. completion <i class="bi bi-arrow-down-up small"></i>
                </th>
                <th>Repair status</th>
                <th class="hide-sm">Fulfilment</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pager"></div>
      </section>
      <div
        class="offcanvas offcanvas-end rp-off"
        tabindex="-1"
        id="rpOff"
        aria-labelledby="rpTitle"
      >
        <div class="offcanvas-header">
          <div>
            <h2 class="offcanvas-title h5 mb-0" id="rpTitle">Repair</h2>
            <small id="rpSub" class="opacity-75"></small>
          </div>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>
        <div class="offcanvas-body" id="rpBody"></div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script src="js/fx.js" defer></script>
    <script src="js/vendor/anime.min.js" defer></script>
    <script src="js/vendor/particles.js" defer></script>
    <script src="js/motionfx.js" defer></script>
    <script src="js/btnfx.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/services-data.js" defer></script>
    <script src="js/repairs.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/charts.js" defer></script>
    <script src="js/repairs-page.js" defer></script>
  </body>
</html>
