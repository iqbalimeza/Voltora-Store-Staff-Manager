<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Management | Voltora</title>
    <meta
      name="description"
      content="Create, assign, search, filter and update store tasks for the Voltora team."
    />
    <meta name="author" content="Voltora Store Staff Task Manager" />
    <meta name="theme-color" content="#0d1526" />
    <meta
      property="og:title"
      content="Task Management | Voltora Store Staff Task Manager"
    />
    <meta
      property="og:description"
      content="Create, assign, search, filter and update store tasks for the Voltora team."
    />
    <meta property="og:type" content="website" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/logo/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/logo/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png" />
    <script src="js/theme.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
    <link href="css/services.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/macos.css" rel="stylesheet" />
    <link href="css/fonts.css" rel="stylesheet" />
    <link href="css/motion.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav"></div>
    <main>
      <nav class="crumbs" aria-label="Breadcrumb" data-anim="header">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="dashboard.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Tasks</li>
        </ol>
      </nav>
      <header class="page-head" data-anim="header">
        <div>
          <h1 id="pageH1">Task Management</h1>
          <p id="pageSub">Assign, track and update daily store tasks.</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-o" id="exportBtn">
            <i class="bi bi-download"></i> Export CSV</button
          ><button class="btn btn-v d-none" id="addBtn">
            <i class="bi bi-plus-lg"></i> Add task
          </button>
        </div>
      </header>

      <section
        class="card-v filter-bar"
        data-anim="filter"
        aria-label="Search and filter tasks"
      >
        <div class="fg grow">
          <label for="q">Search task</label
          ><input
            id="q"
            type="search"
            class="form-control"
            placeholder="Title, ID or staff name"
          />
        </div>
        <div class="fg" id="fStaffWrap">
          <label for="fStaff">Staff</label
          ><select id="fStaff" class="form-select"></select>
        </div>
        <div class="fg">
          <label for="fPri">Priority</label
          ><select id="fPri" class="form-select">
            <option value="">All</option>
          </select>
        </div>
        <div class="fg">
          <label for="fStatus">Status</label
          ><select id="fStatus" class="form-select">
            <option value="">All</option>
          </select>
        </div>
        <div class="fg">
          <label for="fDate">Due date</label
          ><select id="fDate" class="form-select">
            <option value="">All dates</option>
            <option value="today">Due today</option>
            <option value="week">Next 7 days</option>
            <option value="month">This month</option>
            <option value="past">Past due</option>
          </select>
        </div>
        <div class="fg">
          <label for="fSort">Sort by</label
          ><select id="fSort" class="form-select">
            <option value="due">Due date</option>
            <option value="pri">Priority</option>
            <option value="progress">Progress</option>
            <option value="title">Task name</option>
          </select>
        </div>
        <div class="fg flex-grow-0" style="flex: 0 0 auto">
          <button class="btn btn-o" id="fReset">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </section>

      <section class="card-v" data-anim="table" aria-label="Task list">
        <div class="table-wrap">
          <table class="table table-v">
            <thead>
              <tr>
                <th>Task</th>
                <th class="hide-md" id="thStaff">Assigned staff</th>
                <th class="hide-sm">Priority</th>
                <th class="hide-xl">Start date</th>
                <th class="hide-sm">Due date</th>
                <th class="hide-sm">Progress</th>
                <th class="hide-sm">Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pager"></div>
      </section>

      <div
        class="modal fade"
        id="taskModal"
        tabindex="-1"
        aria-labelledby="taskModalTitle"
        aria-hidden="true"
      >
        <div
          class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"
        >
          <form class="modal-content" id="taskForm" novalidate>
            <div class="modal-header">
              <h2 class="modal-title" id="taskModalTitle">Add task</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="tId" />
              <div class="row g-3">
                <div class="col-md-8">
                  <label class="form-label" for="tTitle">Task title *</label
                  ><input id="tTitle" class="form-control" maxlength="80" />
                  <div class="invalid-feedback">Please enter a task title.</div>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="tCat">Category</label
                  ><select id="tCat" class="form-select"></select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="tDesc">Description</label
                  ><textarea
                    id="tDesc"
                    class="form-control"
                    rows="2"
                    maxlength="300"
                  ></textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="tStaff">Assigned staff *</label
                  ><select id="tStaff" class="form-select"></select>
                  <div class="invalid-feedback">
                    Please assign a staff member.
                  </div>
                </div>
                <div class="col-md-3 col-6">
                  <label class="form-label" for="tPri">Priority</label
                  ><select id="tPri" class="form-select"></select>
                </div>
                <div class="col-md-3 col-6">
                  <label class="form-label" for="tStatus">Status</label
                  ><select id="tStatus" class="form-select"></select>
                </div>
                <div class="col-md-6 col-6">
                  <label class="form-label" for="tStart">Start date *</label
                  ><input id="tStart" type="date" class="form-control" />
                  <div class="invalid-feedback">Choose a start date.</div>
                </div>
                <div class="col-md-6 col-6">
                  <label class="form-label" for="tDue">Due date *</label
                  ><input id="tDue" type="date" class="form-control" />
                  <div class="invalid-feedback" id="tDueErr">
                    Choose a due date.
                  </div>
                </div>
                <div class="col-12">
                  <label class="form-label" for="tProg"
                    >Progress: <output id="tProgOut">0%</output></label
                  ><input
                    id="tProg"
                    type="range"
                    class="form-range"
                    min="0"
                    max="100"
                    step="5"
                    value="0"
                  />
                </div>
                <div class="col-12">
                  <label class="form-label" for="tRem">Remarks</label
                  ><textarea
                    id="tRem"
                    class="form-control"
                    rows="2"
                    maxlength="300"
                    placeholder="Optional notes for the team"
                  ></textarea>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-o" data-bs-dismiss="modal">
                Cancel</button
              ><button class="btn btn-v" type="submit">
                <i class="bi bi-check2"></i> Save task
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"
      defer
    ></script>
    <script src="js/fx.js" defer></script>
    <script src="js/vendor/anime.min.js" defer></script>
    <script src="js/vendor/particles.js" defer></script>
    <script src="js/motionfx.js" defer></script>
    <script src="js/btnfx.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/services-data.js" defer></script>
    <script src="js/repairs.js" defer></script>
    <script src="js/layout.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/tasks.js" defer></script>
  </body>
</html>
